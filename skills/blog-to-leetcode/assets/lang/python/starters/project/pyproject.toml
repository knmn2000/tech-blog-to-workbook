[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "{{NAME}}"
version = "0.1.0"
description = "Built with the {{TITLE}}"
requires-python = ">=3.10"

[project.scripts]
{{NAME}} = "{{NAME}}.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
